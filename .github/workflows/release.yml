name: Release

# Publishes a GitHub Release (tag + changelog) for each production deploy.
# - push to master: if the pushed commit is the merge of a "Release vX.Y.Z"
#   PR, tag that commit and use the PR description as the release notes.
# - workflow_dispatch: create a release by hand (e.g. the v0.1.0 baseline).
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string
      target:
        description: "Commit SHA to tag (defaults to the master head)"
        required: false
        type: string
        default: ""
      notes:
        description: "Release notes (markdown). Multi-line notes are best passed via gh workflow run release.yml -F notes=@notes.md"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      # Lets gh run without a checkout
      GH_REPO: ${{ github.repository }}
    steps:
      # User-controlled values (PR title/body, dispatch inputs) are only ever
      # passed through env vars or files, never interpolated into scripts,
      # to avoid script injection.
      - name: Find release PR for pushed commit
        id: from_pr
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          pulls=$(gh api "repos/$GH_REPO/commits/$SHA/pulls")
          merged=$(jq -c '[.[] | select(.merged_at != null and .base.ref == "master")]' <<< "$pulls")
          pr=$(jq -c '[.[] | select(.title | test("^Release v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // empty' <<< "$merged")
          if [ -z "$pr" ]; then
            # A merge from dev, or a PR titled like a release, was meant to be
            # one, so a malformed title must not silently skip the release
            bad=$(jq -r '[.[] | select(.head.ref == "dev"
                    or (.title | ascii_downcase | startswith("release")))] | first // empty
                    | "#\(.number) \"\(.title)\""' <<< "$merged")
            if [ -n "$bad" ]; then
              echo "::error::PR $bad looks like a release PR, but its title is not exactly 'Release vX.Y.Z' (e.g. 'Release v0.2.0'), so no release was published. Publish it by running this workflow by hand (workflow_dispatch) with the version, target $SHA and notes."
              exit 1
            fi
            echo "No merged 'Release vX.Y.Z' PR into master for $SHA; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The title matched the strict regex above, so the version is safe
          version=$(jq -r '.title | sub("^Release "; "")' <<< "$pr")
          number=$(jq -r '.number' <<< "$pr")
          jq -r '.body // ""' <<< "$pr" > "$NOTES_FILE"
          echo "Releasing $version from PR #$number at $SHA"
          {
            echo "release=true"
            echo "version=$version"
            echo "target=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Validate manual release inputs
        id: from_input
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must look like vX.Y.Z (e.g. v0.1.0)"
            exit 1
          fi
          if [ -z "$TARGET" ]; then
            TARGET=$(gh api "repos/$GH_REPO/commits/master" --jq .sha)
            echo "No target given; using master head $TARGET"
          elif ! [[ "$TARGET" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Target '$TARGET' must be a commit SHA"
            exit 1
          else
            # Expand a short SHA and make sure the commit exists
            TARGET=$(gh api "repos/$GH_REPO/commits/$TARGET" --jq .sha)
          fi
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          {
            echo "release=true"
            echo "version=$VERSION"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      # Release PR descriptions written by Claude Code end with an attribution
      # footer ("🤖 Generated with ..." or "---" + "_Generated by [Claude
      # Code]..._"), which doesn't belong in the published changelog.
      - name: Strip attribution footer from notes
        if: steps.from_pr.outputs.release == 'true' || steps.from_input.outputs.release == 'true'
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          python3 - "$NOTES_FILE" <<'EOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              lines = f.read().replace("\r\n", "\n").split("\n")

          def trim_blank(lines):
              while lines and not lines[-1].strip():
                  lines.pop()

          # Drop the last "🤖 Generated with" line and everything after it
          for i in range(len(lines) - 1, -1, -1):
              if lines[i].lstrip().startswith("🤖 Generated with"):
                  del lines[i:]
                  break

          # Then drop any trailing "_Generated by [Claude Code]..._" lines and
          # "---" separators left at the end
          trim_blank(lines)
          while lines and (
              lines[-1].strip() == "---"
              or re.match(r"^_Generated by \[Claude Code\].*_$", lines[-1].strip())
          ):
              lines.pop()
              trim_blank(lines)

          if not lines:
              sys.exit("Release notes are empty after stripping the footer")

          with open(path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF
          echo "Release notes:"
          cat "$NOTES_FILE"

      - name: Create tag and release
        if: steps.from_pr.outputs.release == 'true' || steps.from_input.outputs.release == 'true'
        env:
          VERSION: ${{ steps.from_pr.outputs.version || steps.from_input.outputs.version }}
          TARGET: ${{ steps.from_pr.outputs.target || steps.from_input.outputs.target }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          # Never move or overwrite an existing version. Only a 404 means the
          # tag is free; any other API failure stops the release.
          if tag_out=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" 2>&1); then
            echo "::error::Tag $VERSION already exists. Pick a new version; existing tags are never overwritten."
            exit 1
          elif ! grep -q "HTTP 404" <<< "$tag_out"; then
            echo "::error::Could not check whether tag $VERSION exists: $tag_out"
            exit 1
          fi
          # Only the highest version is marked Latest, so an older one (e.g.
          # the v0.1.0 baseline published after v0.2.0) doesn't take over.
          # sort -V compares numerically, so v0.10.0 > v0.9.0
          existing=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          highest=$(printf '%s\n%s\n' "$existing" "$VERSION" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$VERSION" = "$highest" ]; then
            latest="--latest"
          else
            latest="--latest=false"
          fi
          gh release create "$VERSION" \
            --target "$TARGET" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE" \
            "$latest"
          echo "Published $VERSION at $TARGET ($latest)"
